name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run setup:browser
      - run: npm install --global @openai/codex@0.167.1
      - run: npm run smoke:platform
      - name: Start isolated Matrix lab
        if: runner.os == 'Linux'
        run: npm run matrix:up
      - name: Verify real encrypted Element calls
        if: runner.os == 'Linux'
        run: npm run smoke:native
      - name: Stop Matrix lab
        if: always() && runner.os == 'Linux'
        run: npm run matrix:down
